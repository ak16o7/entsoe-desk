services:
  - type: web
    name: entsoe-desk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENTSOE_API_KEY
        sync: false
      - key: ENTSOE_ENDPOINT_URL
        value: https://web-api.tp.entsoe.eu/api
      - key: ENTSOE_REFRESH_SECONDS
        value: "300"
      - key: ENTSOE_CACHE_SECONDS
        value: "240"
      - key: ENTSOE_CACHE_MAX_ENTRIES
        value: "256"
      - key: ENTSOE_HTTP_TIMEOUT
        value: "35"
      - key: ENTSOE_MAX_REQUESTS_PER_MINUTE
        value: "300"
